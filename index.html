<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄酱存档</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <img class="logo" src="assets/icons/logo.svg" alt="番茄酱存档 Logo">
    <h1>番茄酱存档</h1>
  </header>

  <main>
    <section class="gallery" id="gallery" aria-label="已收藏番茄酱"></section>

    <section class="missed-section" aria-labelledby="missedTitle">
      <div class="divider"></div>
      <h2 id="missedTitle">空手而归</h2>
      <div class="carousel" id="carousel" aria-label="空手而归记录"></div>
    </section>

    <section class="about" aria-label="关于番茄酱存档">
      <p>番茄酱是全球化最无聊的证明。它出现在每一个麦当劳，从上海到圣地亚哥，从首尔到纽约。配方几乎相同，包装几乎相同，甚至连撕开的方式都被设计成一致的。它是标准化生产的极端产物——小到没有人注意，统一到没有人质疑。但仔细看，它又不完全一样。不同国家的印刷工艺不同，语言不同，有的角落印着清真认证，有的背面密密麻麻是成分表。同一个配方，在不同的地方生产，流通，被顺手拿走，或者被丢掉。我开始收集它，不是因为它珍贵，而是因为它太普通了。这个档案没有终点。缺席的记录和存在的记录一样重要——它们共同说明一件事：我去过那里，或者，我还没有。</p>
    </section>
  </main>

  <div class="modal" id="modal">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-image-area" id="modalImageArea">
    <img class="modal-image" id="modalImage" src="" alt="">
    <div class="modal-label" id="modalLabel">
      <span id="labelFront">正</span><span class="modal-label-sep">/</span><span id="labelBack">反</span>
    </div>
  </div>
  <button class="modal-close" id="modalClose">×</button>
</div>

  <script src="script.js"></script>
</body>
</html>
